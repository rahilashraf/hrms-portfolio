services:
  postgres:
    image: postgres:17-alpine
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Published on the loopback interface only, so the development database is not
    # reachable from other machines on the network. Containers on the compose network are
    # unaffected; tools on this machine connect to localhost / 127.0.0.1 as before.
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - hrms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hrms-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT}:6379'
    volumes:
      - hrms_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hrms_postgres_data:
  hrms_redis_data:
